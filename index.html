  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #f0f2f5; color: #333; }

    /* Панель инструментов (слева) */
    #toolbar { width: 220px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; padding: 10px; z-index: 10; }
    .toolbar-header { font-weight: bold; margin-bottom: 15px; color: #0066cc; font-size: 1.1em; text-align: center;}
    .tool-item {
      background: #f9f9f9; border: 1px solid #ccc; border-radius: 6px;
      padding: 10px; margin-bottom: 10px; cursor: grab;
      text-align: center; user-select: none; transition: background 0.2s;
    }
    .tool-item:hover { background: #e0f0ff; border-color: #0066cc; }
    .tool-item svg { pointer-events: none; margin-bottom: 5px;}

    /* Холст (центр) */
    #canvas-container { flex: 1; position: relative; overflow: auto; background: #fafafa; background-image: radial-gradient(#ddd 1px, transparent 1px); background-size: 20px 20px;}
    #paper { cursor: crosshair; }

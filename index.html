<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Mermaid Visual Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; background: #f4f6f8; color: #333; }
    
    /* Панель инструментов и холст */
    #editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
    #toolbar { padding: 10px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 10px; }
    button { padding: 8px 12px; background: #0066cc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0052a3; }
    
    #canvas { flex: 1; position: relative; overflow: hidden; background: #fafafa; }
    
    /* Узлы на холсте */
    .node {
      position: absolute; width: 120px; padding: 10px; background: #fff;
      border: 2px solid #0066cc; border-radius: 6px; text-align: center;
      cursor: move; user-select: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .node.selected { border-color: #ff9900; box-shadow: 0 0 8px rgba(255, 153, 0, 0.5); }
    .node input { width: 100%; border: none; text-align: center; font-size: 14px; background: transparent; }
    .node input:focus { outline: none; background: #f0f0f0; }

    /* Панель Mermaid */
    #sidebar { width: 400px; display: flex; flex-direction: column; background: #fff; }
    .panel-title { padding: 10px; font-weight: bold; background: #eee; border-bottom: 1px solid #ddd; }
    #mermaid-code { width: 100%; height: 150px; padding: 10px; font-family: monospace; border: none; border-bottom: 1px solid #ddd; resize: none; }
    #mermaid-preview { flex: 1; padding: 10px; overflow: auto; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div id="editor-container">
    <div id="toolbar">
      <button onclick="addNode()">+ Добавить узел</button>
      <button onclick="connectSelected()">Связать выбранные (2)</button>
      <button onclick="clearCanvas()" style="background:#cc0000;">Очистить</button>
    </div>
    <div id="canvas"></div>
  </div>

  <div id="sidebar">
    <div class="panel-title">Код Mermaid</div>
    <textarea id="mermaid-code" readonly></textarea>
    <div class="panel-title">Предпросмотр</div>
    <div id="mermaid-preview" class="mermaid"></div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false });

    let nodes = [];
    let connections = [];
    let selectedNodes = [];
    let nodeIdCounter = 1;

    const canvas = document.getElementById('canvas');

    function addNode() {
      const id = `node_${nodeIdCounter++}`;
      const nodeData = { id, label: `Узел ${nodeIdCounter - 1}`, x: 50 + nodes.length * 20, y: 50 + nodes.length * 20 };
      nodes.push(nodeData);
      renderNodes();
      updateMermaid();
    }

    function renderNodes() {
      canvas.innerHTML = '';
      nodes.forEach(n => {
        const div = document.createElement('div');
        div.className = `node ${selectedNodes.includes(n.id) ? 'selected' : ''}`;
        div.style.left = n.x + 'px';
        div.style.top = n.y + 'px';
        
        const input = document.createElement('input');
        input.value = n.label;
        input.onchange = (e) => { n.label = e.target.value; updateMermaid(); };
        
        div.appendChild(input);
        
        // Перетаскивание
        div.onmousedown = (e) => dragStart(e, n);
        div.onclick = (e) => {
          e.stopPropagation();
          toggleSelect(n.id);
        };

        canvas.appendChild(div);
      });
    }

    function toggleSelect(id) {
      if (selectedNodes.includes(id)) {
        selectedNodes = selectedNodes.filter(i => i !== id);
      } else {
        if (selectedNodes.length >= 2) selectedNodes.shift();
        selectedNodes.push(id);
      }
      renderNodes();
    }

    function connectSelected() {
      if (selectedNodes.length === 2) {
        connections.push({ from: selectedNodes[0], to: selectedNodes[1] });
        selectedNodes = [];
        renderNodes();
        updateMermaid();
      } else {
        alert('Выберите ровно 2 узла для создания связи (кликните по ним)');
      }
    }

    function dragStart(e, node) {
      if (e.target.tagName === 'INPUT') return;
      let startX = e.clientX - node.x;
      let startY = e.clientY - node.y;

      function dragMove(e) {
        node.x = e.clientX - startX;
        node.y = e.clientY - startY;
        renderNodes();
      }

      function dragEnd() {
        document.removeEventListener('mousemove', dragMove);
        document.removeEventListener('mouseup', dragEnd);
      }

      document.addEventListener('mousemove', dragMove);
      document.addEventListener('mouseup', dragEnd);
    }

    function clearCanvas() {
      nodes = []; connections = []; selectedNodes = []; nodeIdCounter = 1;
      renderNodes(); updateMermaid();
    }

    function updateMermaid() {
      let code = 'graph TD\n';
      nodes.forEach(n => {
        code += `  ${n.id}["${n.label}"]\n`;
      });
      connections.forEach(c => {
        code += `  ${c.from} --> ${c.to}\n`;
      });

      document.getElementById('mermaid-code').value = code;
      
      const preview = document.getElementById('mermaid-preview');
      preview.removeAttribute('data-processed');
      preview.innerHTML = code;
      mermaid.contentLoaded();
    }

    // Инициализация с двумя узлами
    addNode(); addNode();
  </script>
</body>
</html>
